<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Face Biometric Lab</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/video-verification.css">
</head>
<body>
<main x-data="videoVerificationApp()" x-init="init()" class="shell">
  <header class="topbar">
    <div><p class="eyebrow">BIOMETRIC VERIFICATION LAB</p><h1>Capture console</h1><p>Server-directed camera verification</p></div>
    <div class="server-status"><span class="status-dot"></span><span>Server connected</span><strong class="method-badge">Loading method</strong></div>
  </header>
  <div class="app-layout">
    <aside class="method-sidebar">
      <p class="eyebrow">AVAILABLE METHODS</p>
      <button class="method-nav live-nav" type="button"><span class="method-icon">◉</span><span><strong>Live stream</strong><small>Frame-by-frame</small></span><i class="method-check">●</i></button>
      <button class="method-nav clip-nav" type="button"><span class="method-icon">▣</span><span><strong>Full clip</strong><small>Upload 3–5 seconds</small></span><i class="method-check">●</i></button>
      <div class="sidebar-note"><span class="lock-icon">◆</span><span>The server selects the active method. The client cannot switch it during a session.</span></div>
    </aside>
    <section class="workspace">
      <section class="card camera-card">
        <div class="section-heading"><div><p class="eyebrow">INPUT</p><h2>Camera</h2></div><span class="state-pill camera-state">Idle</span></div>
        <label>Camera<select x-model="deviceId"><template x-for="c in cameras"><option :value="c.deviceId" x-text="c.label||'Camera'"></option></template></select></label>
        <video id="preview" autoplay muted playsinline></video>
        <div class="row"><button class="primary" @click="start" :disabled="recording">Start camera</button><button @click="stop" :disabled="!stream">Stop camera</button></div>
        <p class="state" x-text="state"></p>
      </section>
      <section class="method-content">
        <section class="card live-panel" hidden></section>
        <article class="card clip-panel" hidden>
          <div class="section-heading"><div><p class="eyebrow">METHOD 1</p><h2>Complete video clip</h2></div><span class="state-pill">3–5 sec</span></div>
          <video id="clip" controls></video>
          <div class="metrics"><div><span>Size</span><b x-text="formatBytes(clipSize)"></b></div><div><span>Duration</span><b x-text="clipDuration+' s'"></b></div></div>
          <label>Reference ID<input x-model="referenceId" placeholder="user-123"></label>
          <button class="primary wide" @click="capture" :disabled="recording||!stream">Capture clip</button>
          <button class="primary wide" @click="verify" :disabled="busy||!clipBlob">Verify complete clip</button>
          <pre x-show="result" x-text="JSON.stringify(result,null,2)"></pre>
        </article>
      </section>
    </section>
  </div>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/live-stream.js"></script>
</body>
</html>
