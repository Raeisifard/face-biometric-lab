server:
  port: 8090
spring:
  application.name: face-biometric-service
  config:
    import:
      - optional:classpath:biometric-embeddings.yml
  servlet.multipart.max-file-size: 25MB
  servlet.multipart.max-request-size: 25MB
  flyway.enabled: false
  autoconfigure.exclude:
    - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
    - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
biometric:
  capture-method: ${BIOMETRIC_CAPTURE_METHOD:FREE_METHOD} # LIVE_STREAM, FULL_CLIP, CLIENT_EMBEDDING, or FREE_METHOD
  repository-type: property
  model-id: arcface-512
  model-version: w600k-r50
  model-path: ${BIOMETRIC_MODEL_PATH:models/recognition/w600k_r50.onnx}
  dimension: 512
  algorithm: COSINE
  threshold: 0.65
  normalized-required: true
  oracle.url: ${BIOMETRIC_ORACLE_URL:}
  oracle.username: ${BIOMETRIC_ORACLE_USERNAME:}
  oracle.password: ${BIOMETRIC_ORACLE_PASSWORD:}
  mongo.uri: ${BIOMETRIC_MONGO_URI:}
  mongo.database: ${BIOMETRIC_MONGO_DATABASE:face_biometric}
  mongo.collection: ${BIOMETRIC_MONGO_COLLECTION:face_embeddings}
  cors.allowed-origins: ${BIOMETRIC_CORS_ORIGINS:http://localhost:8091}
  video-verification:
    enabled: true
    max-clip-bytes: 26214400
    min-duration-seconds: 3.0
    max-duration-seconds: 5.0
    sample-fps: 4.0
    min-face-size-pixels: 80
    max-faces: 1
    min-quality-score: 0.45
    liveness-required: true
    liveness-threshold: 0.50
    recognition-frames: 5
    aggregation: MEAN
    storage-directory: ${BIOMETRIC_VIDEO_STORAGE_DIR:video-captures}
    detector-model-path: ${BIOMETRIC_DETECTOR_MODEL_PATH:../models/detector/face_detection_yunet_2023mar.onnx}
    liveness-model-path: ${BIOMETRIC_LIVENESS_MODEL_PATH:../models/liveness/2.7_80x80_MiniFASNetV2.onnx}
    recognition-model-path: ${BIOMETRIC_MODEL_PATH:../models/recognition/w600k_r50.onnx}
management.endpoints.web.exposure.include: health,info
logging:
  level:
    com.isc.facebiometricservice: DEBUG
    com.isc.facebiometricservice.videoverification: DEBUG
    com.isc.facebiometricservice.api.VideoVerificationController: DEBUG
