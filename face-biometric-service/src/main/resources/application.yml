server:
  port: 8090
spring:
  application.name: face-biometric-service
  config:
    import:
      - optional:classpath:biometric-embeddings.yml
  servlet.multipart.max-file-size: 25MB
  servlet.multipart.max-request-size: 25MB
  flyway.enabled: false
  autoconfigure.exclude:
    - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
    - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
biometric:
  capture-method: ${BIOMETRIC_CAPTURE_METHOD:FREE_METHOD} # LIVE_STREAM, FULL_CLIP, CLIENT_EMBEDDING, or FREE_METHOD
  repository-type: property
  policy:
    enabled: true
    default-profile: ${BIOMETRIC_POLICY_PROFILE:NORMAL}
    selection-mode: ${BIOMETRIC_POLICY_SELECTION_MODE:SERVER_ASSIGNED}
    profiles:
    method-policies:
      SERVER_FULL_CLIP:
        method: SERVER_FULL_CLIP
        min-duration-seconds: 3.0
        max-duration-seconds: 5.0
        required-frame-count: 0
        upload-fps: 4.0
        max-payload-bytes: 26214400
        liveness-mode: PASSIVE
        liveness-threshold: 0.50
        min-quality-score: 0.45
        recognition-model-id: arcface-512
        recognition-model-version: w600k-r50
        threshold: 0.65
        fallback-method: HYBRID_SINGLE_FRAME
        session-ttl-seconds: 120
        version: 1
      SERVER_LIVE_STREAM:
        method: SERVER_LIVE_STREAM
        min-duration-seconds: 2.0
        max-duration-seconds: 8.0
        required-frame-count: 5
        upload-fps: 4.0
        max-payload-bytes: 8388608
        liveness-mode: PASSIVE
        liveness-threshold: 0.50
        min-quality-score: 0.45
        recognition-model-id: arcface-512
        recognition-model-version: w600k-r50
        threshold: 0.65
        fallback-method: HYBRID_SINGLE_FRAME
        session-ttl-seconds: 120
        version: 1
      CLIENT_EMBEDDING:
        method: CLIENT_EMBEDDING
        min-duration-seconds: 0.0
        max-duration-seconds: 0.0
        required-frame-count: 1
        upload-fps: 0.0
        max-payload-bytes: 1048576
        liveness-mode: NONE
        liveness-threshold: 0.0
        min-quality-score: 0.45
        recognition-model-id: mobilefacenet-512
        recognition-model-version: w600k-mbf
        threshold: 0.65
        fallback-method: HYBRID_SINGLE_FRAME
        session-ttl-seconds: 120
        version: 1
      HYBRID_SINGLE_FRAME:
        method: HYBRID_SINGLE_FRAME
        min-duration-seconds: 0.0
        max-duration-seconds: 0.0
        required-frame-count: 1
        upload-fps: 0.0
        max-payload-bytes: 8388608
        liveness-mode: PASSIVE
        liveness-threshold: 0.50
        min-quality-score: 0.45
        recognition-model-id: arcface-512
        recognition-model-version: w600k-r50
        threshold: 0.65
        fallback-method: SERVER_FULL_CLIP
        session-ttl-seconds: 120
        version: 1
      HYBRID_MULTI_FRAME:
        method: HYBRID_MULTI_FRAME
        min-duration-seconds: 1.0
        max-duration-seconds: 6.0
        required-frame-count: 4
        upload-fps: 4.0
        max-payload-bytes: 26214400
        liveness-mode: PASSIVE
        liveness-threshold: 0.50
        min-quality-score: 0.45
        recognition-model-id: arcface-512
        recognition-model-version: w600k-r50
        threshold: 0.65
        fallback-method: HYBRID_SINGLE_FRAME
        session-ttl-seconds: 120
        version: 1
      NORMAL:
        method: ${BIOMETRIC_POLICY_METHOD:${BIOMETRIC_CAPTURE_METHOD:HYBRID_MULTI_FRAME}}
        min-duration-seconds: 2.0
        max-duration-seconds: 6.0
        required-frame-count: 4
        upload-fps: 4.0
        max-payload-bytes: 26214400
        liveness-mode: PASSIVE
        liveness-threshold: 0.50
        min-quality-score: 0.45
        recognition-model-id: arcface-512
        recognition-model-version: w600k-r50
        threshold: 0.65
        fallback-method: HYBRID_SINGLE_FRAME
        session-ttl-seconds: 120
      HIGH_RISK:
        method: ${BIOMETRIC_HIGH_RISK_METHOD:HYBRID_MULTI_FRAME}
        min-duration-seconds: 3.0
        max-duration-seconds: 8.0
        required-frame-count: 6
        upload-fps: 5.0
        max-payload-bytes: 26214400
        liveness-mode: ACTIVE
        liveness-threshold: 0.60
        min-quality-score: 0.50
        recognition-model-id: arcface-512
        recognition-model-version: w600k-r50
        threshold: 0.70
        fallback-method: HYBRID_SINGLE_FRAME
        session-ttl-seconds: 120
      VERY_HIGH_RISK:
        method: ${BIOMETRIC_VERY_HIGH_RISK_METHOD:SERVER_FULL_CLIP}
        min-duration-seconds: 3.0
        max-duration-seconds: 10.0
        required-frame-count: 0
        upload-fps: 4.0
        max-payload-bytes: 26214400
        liveness-mode: PASSIVE
        min-quality-score: 0.55
        recognition-model-id: arcface-512
        recognition-model-version: w600k-r50
        threshold: 0.72
        fallback-method: null
        session-ttl-seconds: 120
  model-id: arcface-512
  model-version: w600k-r50
  model-path: ${BIOMETRIC_MODEL_PATH:models/recognition/w600k_r50.onnx}
  dimension: 512
  algorithm: COSINE
  threshold: 0.65
  normalized-required: true
  oracle.url: ${BIOMETRIC_ORACLE_URL:}
  oracle.username: ${BIOMETRIC_ORACLE_USERNAME:}
  oracle.password: ${BIOMETRIC_ORACLE_PASSWORD:}
  mongo.uri: ${BIOMETRIC_MONGO_URI:}
  mongo.database: ${BIOMETRIC_MONGO_DATABASE:face_biometric}
  mongo.collection: ${BIOMETRIC_MONGO_COLLECTION:face_embeddings}
  cors.allowed-origins: ${BIOMETRIC_CORS_ORIGINS:http://localhost:8091}
  video-verification:
    enabled: true
    max-clip-bytes: 26214400
    min-duration-seconds: 3.0
    max-duration-seconds: 5.0
    sample-fps: 4.0
    min-face-size-pixels: 80
    max-faces: 1
    min-quality-score: 0.45
    liveness-required: true
    liveness-threshold: 0.50
    recognition-frames: 5
    aggregation: MEAN
    storage-directory: ${BIOMETRIC_VIDEO_STORAGE_DIR:video-captures}
    detector-model-path: ${BIOMETRIC_DETECTOR_MODEL_PATH:../models/detector/face_detection_yunet_2023mar.onnx}
    liveness-model-path: ${BIOMETRIC_LIVENESS_MODEL_PATH:../models/liveness/2.7_80x80_MiniFASNetV2.onnx}
    recognition-model-path: ${BIOMETRIC_MODEL_PATH:../models/recognition/w600k_r50.onnx}
  hybrid-multi-frame:
    enabled: ${BIOMETRIC_HYBRID_MULTI_FRAME_ENABLED:true}
    default-frames: ${BIOMETRIC_HYBRID_MULTI_FRAME_DEFAULT:4}
    max-frames: ${BIOMETRIC_HYBRID_MULTI_FRAME_MAX:8}
    max-frame-bytes: ${BIOMETRIC_HYBRID_MULTI_FRAME_MAX_FRAME_BYTES:8388608}
    session-ttl-seconds: ${BIOMETRIC_HYBRID_MULTI_FRAME_SESSION_TTL:120}
    liveness-mode: ${BIOMETRIC_HYBRID_MULTI_FRAME_LIVENESS:PASSIVE}
    aggregation: ${BIOMETRIC_HYBRID_MULTI_FRAME_AGGREGATION:MEAN}
management.endpoints.web.exposure.include: health,info
logging:
  level:
    com.isc.facebiometricservice: DEBUG
    com.isc.facebiometricservice.videoverification: DEBUG
    com.isc.facebiometricservice.api.VideoVerificationController: DEBUG
